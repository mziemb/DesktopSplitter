name: Build DesktopSplitter

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['dev/codex-desktopsplitter']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor-identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test managed identity, resolution and migration (no display APIs)
        run: dotnet run --project tests/MonitorIdentity/MonitorIdentity.Tests.csproj -c Release
      - name: Test native identity matching (no display APIs)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/MonitorIdentity/IdentityProbe.cpp -o /tmp/identity-probe
          /tmp/identity-probe
  installer-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer stages and rollback policy (mocks only; no PnP)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/Installer/InstallPolicyTests.cpp -o /tmp/installer-policy-tests
          /tmp/installer-policy-tests
  installer-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer scripts (no execution)
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem installer -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Compile and link installer only (no payload, no PnP, no install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $out = Join-Path $root 'work/installer-compile'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $version = (Get-Content VERSION | Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith('#') } | Select-Object -Last 1).Trim()
          @("#define DS_VERSION_WSTR L`"$version`"", "#define DS_VERSION_STR `"$version`"") | Set-Content (Join-Path $out 'Version.h') -Encoding ascii
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not found' }
          $sources = @(Get-ChildItem installer/setup -Filter '*.cpp' | ForEach-Object { '"' + $_.FullName + '"' })
          $sources += '"' + (Join-Path $root 'installer/common/DeviceNode.cpp') + '"'
          $sources += '"' + (Join-Path $root 'compositor/src/Json.cpp') + '"'
          $cmd = @(
            '@echo off',
            ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul'),
            ('cl /nologo /std:c++17 /EHsc /W4 /WX /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I"' + $out + '" /I"' + $root + '\shared" ' + ($sources -join ' ') + ' /Fe:installer-compile.exe /link /SUBSYSTEM:WINDOWS setupapi.lib newdev.lib cfgmgr32.lib wintrust.lib crypt32.lib comctl32.lib shell32.lib ole32.lib oleaut32.lib advapi32.lib user32.lib gdi32.lib')
          )
          $cmd | Set-Content (Join-Path $out 'compile.cmd') -Encoding ascii
          Push-Location $out
          try { & cmd.exe /c compile.cmd; if ($LASTEXITCODE -ne 0) { throw "Installer compiler/linker failed: $LASTEXITCODE" } }
          finally { Pop-Location }
      - name: Test Windows file replacement and rollback (temporary files only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $out = Join-Path $root 'work/installer-compile'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $sources = @(Get-ChildItem installer/setup -Filter '*.cpp' | Where-Object Name -ne 'Setup.cpp' | ForEach-Object { '"' + $_.FullName + '"' })
          $sources += '"' + (Join-Path $root 'installer/common/DeviceNode.cpp') + '"'
          $sources += '"' + (Join-Path $root 'compositor/src/Json.cpp') + '"'
          $sources += '"' + (Join-Path $root 'tests/Installer/FileMaintenanceTests.cpp') + '"'
          $cmd = @(
            '@echo off',
            ('call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul'),
            ('cl /nologo /std:c++17 /EHsc /W4 /WX /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I"' + $out + '" /I"' + $root + '\shared" ' + ($sources -join ' ') + ' /Fe:file-maintenance-tests.exe /link /SUBSYSTEM:CONSOLE setupapi.lib newdev.lib cfgmgr32.lib wintrust.lib crypt32.lib comctl32.lib shell32.lib ole32.lib oleaut32.lib advapi32.lib user32.lib gdi32.lib')
          )
          $cmd | Set-Content (Join-Path $out 'file-tests.cmd') -Encoding ascii
          Push-Location $out
          try {
            & cmd.exe /c file-tests.cmd
            if ($LASTEXITCODE -ne 0) { throw "File test compilation failed: $LASTEXITCODE" }
            & .\file-maintenance-tests.exe
            if ($LASTEXITCODE -ne 0) { throw "File maintenance tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test actual hidden WPF installer endpoint (no display changes)
        shell: pwsh
        run: |
          dotnet run --project tests/InstallerIpc/InstallerIpc.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "WPF IPC tests failed: $LASTEXITCODE" }
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'WDK installer signature verification failed'
          }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "WDK installation failed: $($p.ExitCode)" }

      - name: Add WDK component to Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
            'modify', '--installPath', "`"$vs`"", `
            '--add', 'Component.Microsoft.Windows.DriverKit', `
            '--quiet', '--norestart'
          if ($p.ExitCode -notin @(0, 3010)) { throw "VS modify failed: $($p.ExitCode)" }

      - name: Diagnose WDK and MSBuild dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          Write-Host "VS: $vs"
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild -version
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\build"
          $taskFiles = @(Get-ChildItem $kits -Recurse -Filter 'Microsoft.DriverKit.Build.Tasks*.dll' -File -ErrorAction SilentlyContinue)
          if ($taskFiles.Count -eq 0) { throw 'No WDK build tasks DLL found' }
          foreach ($file in $taskFiles) {
            Write-Host "WDK task assembly: $($file.FullName)"
            try {
              $asm = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName)
              Write-Host "  Assembly version: $($asm.Version)"
            } catch { Write-Warning $_.Exception.Message }
          }
          $toolsets = @(Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          Write-Host "Toolsets: $($toolsets -join ', ')"
          if ($toolsets -notcontains 'WindowsUserModeDriver10.0') { throw 'WindowsUserModeDriver10.0 toolset missing' }
          $dll = Join-Path $kits '10.0.26100.0\bin\Microsoft.DriverKit.Build.Tasks.18.0.dll'
          if (Test-Path $dll) {
            Write-Host 'WDK task DLL dependencies:'
            try { [System.Reflection.Assembly]::LoadFrom($dll) | Out-Null; Write-Host 'Assembly loaded in PowerShell runtime' }
            catch { Write-Warning "Assembly load test: $($_.Exception.ToString())" }
          }

      - name: Build all (Release)
        id: build
        shell: pwsh
        run: .\build.ps1 -Configuration Release -NoVersionBump

      - name: Installer self-checks
        shell: pwsh
        run: |
          $exe = 'installer\setup\bin\x64\Release\DesktopSplitterSetup.exe'
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          & $exe /verify | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/verify failed ($LASTEXITCODE)" }
          & $exe /selftest | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/selftest failed ($LASTEXITCODE)" }

      - name: Stamp artifact name
        id: stamp
        shell: pwsh
        run: |
          $version = '${{ steps.build.outputs.version }}'
          if (-not $version) { $version = (Get-Content 'build\generated\version.txt' -Raw).Trim() }
          if (-not $version) { throw 'could not determine product version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item 'installer\setup\bin\x64\Release\DesktopSplitterSetup.exe' "DesktopSplitterSetup-MZ-$version.exe"

      - name: Upload build artifact (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSplitterSetup-MZ-${{ steps.stamp.outputs.version }}
          path: DesktopSplitterSetup-MZ-${{ steps.stamp.outputs.version }}.exe
          compression-level: 0
