name: Build DesktopSplitter

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'WDK installer signature verification failed'
          }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { throw "WDK installation failed: $($p.ExitCode)" }

      - name: Add WDK component to Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
            'modify', '--installPath', "`"$vs`"", `
            '--add', 'Component.Microsoft.Windows.DriverKit', `
            '--quiet', '--norestart'
          if ($p.ExitCode -notin @(0, 3010)) { throw "VS modify failed: $($p.ExitCode)" }

      - name: Diagnose WDK and MSBuild dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          Write-Host "VS: $vs"
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild -version
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\build"
          $taskFiles = @(Get-ChildItem $kits -Recurse -Filter 'Microsoft.DriverKit.Build.Tasks*.dll' -File -ErrorAction SilentlyContinue)
          if ($taskFiles.Count -eq 0) { throw 'No WDK build tasks DLL found' }
          foreach ($file in $taskFiles) {
            Write-Host "WDK task assembly: $($file.FullName)"
            try {
              $asm = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName)
              Write-Host "  Assembly version: $($asm.Version)"
            } catch { Write-Warning $_.Exception.Message }
          }
          $toolsets = @(Get-ChildItem "$vs\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          Write-Host "Toolsets: $($toolsets -join ', ')"
          if ($toolsets -notcontains 'WindowsUserModeDriver10.0') { throw 'WindowsUserModeDriver10.0 toolset missing' }
          $dll = Join-Path $kits '10.0.26100.0\bin\Microsoft.DriverKit.Build.Tasks.18.0.dll'
          if (Test-Path $dll) {
            Write-Host 'WDK task DLL dependencies:'
            try { [System.Reflection.Assembly]::LoadFrom($dll) | Out-Null; Write-Host 'Assembly loaded in PowerShell runtime' }
            catch { Write-Warning "Assembly load test: $($_.Exception.ToString())" }
          }

      - name: Build all (Release)
        id: build
        shell: pwsh
        run: .\build.ps1 -Configuration Release -NoVersionBump

      - name: Installer self-checks
        shell: pwsh
        run: |
          $exe = 'installer\setup\bin\x64\Release\DesktopSplitterSetup.exe'
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          & $exe /verify | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/verify failed ($LASTEXITCODE)" }
          & $exe /selftest | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "/selftest failed ($LASTEXITCODE)" }

      - name: Stamp artifact name
        id: stamp
        shell: pwsh
        run: |
          $version = '${{ steps.build.outputs.version }}'
          if (-not $version) { $version = (Get-Content 'build\generated\version.txt' -Raw).Trim() }
          if (-not $version) { throw 'could not determine product version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item 'installer\setup\bin\x64\Release\DesktopSplitterSetup.exe' "DesktopSplitterSetup-$version.exe"

      - name: Upload build artifact (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}
          path: DesktopSplitterSetup-${{ steps.stamp.outputs.version }}.exe
          compression-level: 0
